name: Platform report
description: Tell us the kit works (or not) on your UCM model and firmware
labels: [platform]
body:
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: UCM6302
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware
      placeholder: 1.0.27.x
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Output of ucm audit --json and ucm probe --json (anonymised)
      render: json
